<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色列表 - LingChat communitymods</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title"><a href="/">LingChat communitymods</a></h1>
      <nav class="nav-links">
        <a href="/">首页</a>
        <a href="/make">创建角色</a>
        <span id="auth-info"></span>
        <a id="auth-link" class="btn small" href="/login">登录</a>
        <a id="admin-link" class="btn small" href="/admin" style="display:none">管理后台</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card" style="margin-bottom:24px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <input type="text" id="search-input" class="input" placeholder="搜索角色名称…" style="flex:1;min-width:220px">
        <button id="search-btn" class="btn btn-primary" style="margin:0"><i class="fas fa-search"></i> 搜索</button>
        <button id="clear-filters" class="btn btn-secondary" style="margin:0">清除筛选</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span style="color:var(--muted);font-size:14px"><i class="fas fa-filter"></i> 标签：</span>
        <span class="tag-chip" id="tag-all" style="font-weight:600">全部</span>
        <span id="tag-filters" style="display:contents"></span>
      </div>
    </section>

    <section>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <h2 id="list-title" style="margin:0">所有角色</h2>
        <div style="display:flex;gap:8px">
          <button class="btn-mini" id="sort-latest">最新上架</button>
          <button class="btn-mini" id="sort-downloads">下载最多</button>
        </div>
      </div>
      <ul id="page-list" class="page-list"></ul>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
    (function () {
      const state = {
        query: new URLSearchParams(window.location.search).get('query') || '',
        tag: new URLSearchParams(window.location.search).get('tag') || '',
        sort: new URLSearchParams(window.location.search).get('sort') || 'latest',
        page: 1,
        totalPages: 1,
      };
      const listEl = document.getElementById('page-list');
      const paginationEl = document.getElementById('pagination');
      const searchInput = document.getElementById('search-input');

      function renderSortButtons() {
        document.getElementById('sort-latest').style.fontWeight = state.sort === 'latest' ? '700' : 'normal';
        document.getElementById('sort-downloads').style.fontWeight = state.sort === 'downloads' ? '700' : 'normal';
      }

      function renderTagFilters(tags) {
        const container = document.getElementById('tag-filters');
        container.innerHTML = '';
        const allBtn = document.getElementById('tag-all');
        allBtn.style.fontWeight = !state.tag ? '700' : '400';
        tags.slice(0, 20).forEach(function (tag) {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.textContent = tag.name;
          if (state.tag === tag.name) chip.style.fontWeight = '700';
          chip.addEventListener('click', function () {
            state.tag = state.tag === tag.name ? '' : tag.name;
            state.page = 1;
            loadPages();
            loadTags();
          });
          container.appendChild(chip);
        });
      }

      function renderList(result) {
        if (!result.items.length) {
          listEl.innerHTML = '<li class="empty-state"><i class="fas fa-box-open"></i>没有找到符合条件的角色</li>';
          paginationEl.innerHTML = '';
          return;
        }
        listEl.innerHTML = result.items.map(function (p) {
          const avatar = p.avatar_url
            ? '<img src="' + LC.escapeAttr(p.avatar_url) + '" alt="' + LC.escapeAttr(p.title) + ' 头像">'
            : '<div class="avatar-placeholder"><i class="fas fa-user-circle"></i></div>';
          const tags = p.tags && p.tags.length
            ? '<div style="margin:8px 0;display:flex;flex-wrap:wrap;gap:4px">' + p.tags.map(function (t) {
                return '<span class="tag-chip" style="cursor:default">' + LC.escapeHtml(t) + '</span>';
              }).join('') + '</div>'
            : '';
          return '<li class="page-card-list-item"><article class="card">' +
            '<div class="page-card-with-avatar">' +
              '<div class="avatar-container"><div class="avatar-image">' + avatar + '</div></div>' +
              '<div class="page-card-content">' +
                '<h3 class="card-title"><a href="/page/' + encodeURIComponent(p.uid) + '">' + LC.escapeHtml(p.title) + '</a></h3>' +
                tags +
                '<div class="card-meta" style="flex-wrap:wrap">' +
                  '<a class="meta-link" href="/api/v1/pages/' + encodeURIComponent(p.uid) + '/download" target="_blank" rel="noopener"><i class="fas fa-download"></i> 下载链接</a>' +
                  '<span class="uploader-info"><i class="fas fa-user"></i> ' + LC.escapeHtml(p.uploader || '匿名用户') + '</span>' +
                  '<span class="uploader-info"><i class="fas fa-calendar"></i> ' + LC.fmtDate(p.created_at) + '</span>' +
                  '<span class="uploader-info"><i class="fas fa-cloud-download-alt"></i> ' + (p.download_count || 0) + ' 次下载</span>' +
                '</div>' +
              '</div>' +
            '</div></article></li>';
        }).join('');

        // 分页
        if (result.total_pages > 1) {
          paginationEl.innerHTML =
            '<button ' + (result.page <= 1 ? 'disabled' : '') + ' id="prev-btn"><i class="fas fa-chevron-left"></i> 上一页</button>' +
            '<span class="page-info">第 ' + result.page + ' / ' + result.total_pages + ' 页 · 共 ' + result.total + ' 个角色</span>' +
            '<button ' + (result.page >= result.total_pages ? 'disabled' : '') + ' id="next-btn">下一页 <i class="fas fa-chevron-right"></i></button>';
          document.getElementById('prev-btn').addEventListener('click', function () { go(result.page - 1); });
          document.getElementById('next-btn').addEventListener('click', function () { go(result.page + 1); });
        } else {
          paginationEl.innerHTML = '';
        }
      }

      function go(page) {
        state.page = Math.max(1, page);
        loadPages();
      }

      async function loadPages() {
        listEl.innerHTML = '<li class="loading"><span class="spinner"></span>加载中…</li>';
        paginationEl.innerHTML = '';
        try {
          const result = await LC.api('/api/v1/pages' + LC.qs({
            query: state.query, tag: state.tag, sort: state.sort,
            page: state.page, page_size: 12
          }));
          state.page = result.page;
          state.totalPages = result.total_pages;
          document.getElementById('list-title').textContent =
            state.query ? '搜索: "' + state.query + '"'
            : state.tag ? '标签: "' + state.tag + '"'
            : state.sort === 'downloads' ? '下载榜'
            : '所有角色';
          renderList(result);
          renderSortButtons();
        } catch (err) {
          listEl.innerHTML = '<li class="empty-state">加载失败：' + LC.escapeHtml(err.message) + '</li>';
          paginationEl.innerHTML = '';
        }
      }

      async function loadTags() {
        try {
          const tags = await LC.api('/api/v1/pages/tags');
          renderTagFilters(tags);
        } catch (err) {
          console.error('加载标签失败:', err);
        }
      }

      searchInput.value = state.query;
      document.getElementById('search-btn').addEventListener('click', function () {
        state.query = searchInput.value.trim();
        state.page = 1;
        loadPages();
      });
      searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          state.query = searchInput.value.trim();
          state.page = 1;
          loadPages();
        }
      });
      document.getElementById('clear-filters').addEventListener('click', function () {
        state.query = ''; state.tag = ''; state.page = 1;
        searchInput.value = '';
        loadPages(); loadTags();
      });
      document.getElementById('tag-all').addEventListener('click', function () {
        state.tag = ''; state.page = 1;
        loadPages(); loadTags();
      });
      document.getElementById('sort-latest').addEventListener('click', function () {
        state.sort = 'latest'; state.page = 1; loadPages();
      });
      document.getElementById('sort-downloads').addEventListener('click', function () {
        state.sort = 'downloads'; state.page = 1; loadPages();
      });

      loadTags();
      loadPages();
    })();
  </script>
</body>
</html>
