            <h2>如何获取角色下载链接</h2>
            <p>在创建角色时，您需要提供一个直接可访问的下载链接（直链）。以下是一些常见的文件托管服务及其获取下载链接的方法：</p>
            <h3>1. GitHub Releases</h3>
            <ol>
                <li>创建一个 GitHub 仓库。</li>
                <li>点击页面右方的 "Releases" 标签。</li>
                <li>点击 "create a new release" 按钮。</li>
                <li>填写版本号和描述，然后上传您的文件作为资产（Assets）。</li>
                <li>找到您想要下载的版本，复制对应的资产（Asset）链接。</li>
            </ol>
