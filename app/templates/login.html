<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - LingChat communitymods</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title"><a href="/">LingChat communitymods</a></h1>
      <nav class="nav-links">
        <a href="/pages">浏览角色</a>
        <a id="auth-link" class="btn small" href="/login">登录</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="card form-card" style="max-width:460px;margin:0 auto">
      <h2><i class="fas fa-sign-in-alt"></i> 用户登录</h2>
      <form id="login-form">
        <div class="field">
          <label for="username">用户名</label>
          <input class="input" id="username" name="username" type="text" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">登录</button>
      </form>
      <p>没有账号？ <a href="/register">立即注册</a></p>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { LC.toast('请填写用户名和密码', 'warning'); return; }
      try {
        const data = await LC.api('/api/v1/auth/login', {
          method: 'POST',
          body: { username: username, password: password }
        });
        LC.setToken(data.token);
        LC.setUser(data.user);
        LC.toast('登录成功，欢迎回来 ' + data.user.username, 'success');
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        setTimeout(function () {
          window.location.href = redirect && redirect.startsWith('/') ? redirect : '/';
        }, 500);
      } catch (err) {
        LC.toast('登录失败：' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
