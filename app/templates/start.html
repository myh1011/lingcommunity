<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>开始 - LingChat communitymods</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="site-title">LingChat communitymods</h1>
      <div class="auth-info">
        <span id="auth-info"></span>
        <a id="auth-link" class="btn small" href="/login">登录</a>
        <a id="register-link" class="btn small" href="/register">注册</a>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="hero-card">
      <div class="hero-content">
        <h2>欢迎来到LingChat创业工坊</h2>
        <p>在这里，您可以创建、分享和发现各种精彩的角色模型。上传您的角色，与社区一起探索无限可能！</p>
        <div class="hero-buttons">
          <a class="btn btn-primary" href="/create">
            <i class="fas fa-plus-circle"></i> 创建角色
          </a>
          <a class="btn btn-secondary" href="/pages">
            <i class="fas fa-compass"></i> 浏览角色
          </a>
        </div>
      </div>
      <style>
        .responsive-img {
          width: 100%;
          height: 300px;
          object-fit: cover;
        }
      </style>
      <div class="hero-image">
        <img src="https://github.com/user-attachments/assets/ffccbe79-87ed-4dbc-8e60-f400efbbab26" class="responsive-img"  alt="">
      </div>
    </section>


  <script>
    // 显示登录状态
    (function(){
      const authUser = localStorage.getItem('auth_user');
      const authInfoEl = document.getElementById('auth-info');
      const authLink = document.getElementById('auth-link');
      const registerLink = document.getElementById('register-link');
      
      if (authUser) {
        authInfoEl.textContent = '欢迎，' + authUser;
        authLink.textContent = '登出';
        authLink.href = '#';
        registerLink.style.display = 'none';
        authLink.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.removeItem('auth_user');
          window.location.reload();
        });
      } else {
        authInfoEl.textContent = '游客用户';
        authLink.textContent = '登录';
        authLink.href = '/login';
        registerLink.style.display = 'inline-block';
      }
    })();
  </script>
</body>
</html>
